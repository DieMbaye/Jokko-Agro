<!-- app.html -->
<!-- Indicateur de chargement global -->
@if (isLoading) {
  <div class="global-loading-overlay">
    <div class="global-loading-content">
      <div class="spinner-large"></div>
      <p>Chargement de l'application...</p>
    </div>
  </div>
}

<!-- Pages publiques (login, register, home) -->
@if (isPublicPage()) {
  <router-outlet />
}

<!-- Pages avec layout (sidebar) -->
@if (!isPublicPage() && !isLoading) {
  <div class="app-layout">
    <!-- Sidebar conditionnel -->
    @if (showSidebar && sidebarConfig) {
      <app-sidebar
        [config]="sidebarConfig"
        [isCollapsed]="isCollapsed"
        (logout)="onLogout()"
      />
    }

    <!-- Contenu principal -->
    <main class="main-content"
          [class.with-sidebar]="showSidebar && sidebarConfig"
          [class.sidebar-collapsed]="isCollapsed">
      <router-outlet />
    </main>

    <!-- Assistant vocal conditionnel -->
    @if (showVoiceAssistant) {
      <app-voice-assistant />
    }
  </div>
}
